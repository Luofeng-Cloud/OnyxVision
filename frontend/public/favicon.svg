<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141320"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
    <linearGradient id="onyxGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bg)" stroke="url(#onyxGlow)" stroke-width="2"/>
  <!-- 立体黑曜石晶体 "O" 形态几何徽标 -->
  <polygon points="50,14 78,28 88,50 78,72 50,86 22,72 12,50 22,28" stroke="url(#onyxGlow)" stroke-width="4.5" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
  <polygon points="50,28 66,38 72,50 66,62 50,72 34,62 28,50 34,38" stroke="url(#onyxGlow)" stroke-width="3" stroke-linejoin="round" fill="url(#onyxGlow)" fill-opacity="0.2"/>
  <!-- 晶体棱线切面 -->
  <line x1="50" y1="14" x2="50" y2="28" stroke="url(#onyxGlow)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="88" y1="50" x2="72" y2="50" stroke="url(#onyxGlow)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="86" x2="50" y2="72" stroke="url(#onyxGlow)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="50" x2="28" y2="50" stroke="url(#onyxGlow)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 晶核光斑 -->
  <circle cx="50" cy="50" r="3.5" fill="#06b6d4"/>
</svg>
