name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js (升级为 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: |
          cd frontend
          npm install

      - name: 编译前端产物
        run: |
          cd frontend
          npm run build

      - name: 同步至 iOS 工程
        run: |
          cd frontend
          npx cap sync ios

      - name: 编译免签 IPA 安装包
        run: |
          cd frontend/ios/App
          if [ -d "App.xcworkspace" ]; then
            echo "Building with App.xcworkspace..."
            xcodebuild build \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_STYLE="Manual"
          else
            echo "Building with App.xcodeproj..."
            xcodebuild build \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_STYLE="Manual"
          fi

          # 封装为标准 .ipa 结构
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r OnyxVision.ipa Payload/

      - name: 上传构建好的 IPA 安装包
        uses: actions/upload-artifact@v4
        with:
          name: OnyxVision-iOS-IPA
          path: frontend/ios/App/OnyxVision.ipa