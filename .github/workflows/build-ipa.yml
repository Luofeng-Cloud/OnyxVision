name: Build and Release iOS IPA

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build iOS IPA & Release
    runs-on: macos-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: |
          cd frontend
          npm install

      - name: 编译前端产物
        run: |
          cd frontend
          npm run build

      - name: 同步至 Capacitor iOS 原生容器
        run: |
          cd frontend
          npx cap sync ios

      - name: 编译免签 IPA 安装包
        run: |
          cd frontend/ios/App
          if [ -d "App.xcworkspace" ]; then
            echo "Building with App.xcworkspace..."
            xcodebuild build \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_STYLE="Manual"
          else
            echo "Building with App.xcodeproj..."
            xcodebuild build \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_STYLE="Manual"
          fi

          # 封装为标准 .ipa 结构
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r OnyxVision.ipa Payload/

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: OnyxVision-iOS-IPA
          path: frontend/ios/App/OnyxVision.ipa
          retention-days: 14

      - name: 发布或更新 GitHub Release 并挂载 IPA
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: frontend/ios/App/OnyxVision.ipa
          name: Release ${{ inputs.tag_name || github.ref_name }}
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
